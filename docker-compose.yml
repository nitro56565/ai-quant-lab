services:
  # Service 1: 24/7 Core Live Paper Trading Engine Container
  paper-trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_quant_paper_trading_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OANDA_BROKER_TYPE=OANDA_PRACTICE
    volumes:
      - ./live_execution_engine:/app/live_execution_engine
      - ./core_machine_learning:/app/core_machine_learning
      - ./core_feature_engineering:/app/core_feature_engineering
      - ./historical_data_ingestion:/app/historical_data_ingestion
      - ./realtime_market_streaming:/app/realtime_market_streaming
      - ./local_data_workspace:/app/local_data_workspace
      - ./trained_model_artifacts:/app/trained_model_artifacts
      - ./production_deployment:/app/production_deployment
      - ./docs:/app/docs
    command: python3 production_deployment/live_engine/run_paper_trading.py

