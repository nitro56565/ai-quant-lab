services:
  # Service 1: 24/7 Core Live Paper Trading Engine Container
  paper-trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_quant_paper_trading_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./live_trading_engine:/app/live_trading_engine
      - ./scripts:/app/scripts
      - ./backend:/app/backend
      - ./models:/app/models
      - ./execution_engine:/app/execution_engine
      - ./research_engine:/app/research_engine
      - ./strategy_engine:/app/strategy_engine
      - ./sample_data_test_records:/app/sample_data_test_records
      - ./market_data_pipeline/output:/app/market_data_pipeline/output
      - ./reports:/app/reports

    command: python3 scripts/run_paper_trading.py


  # Service 2: Institutional Paper Trading Web Dashboard Container
  paper-trading-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_quant_paper_trading_dashboard
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - ./live_trading_engine:/app/live_trading_engine
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./reports:/app/reports
    depends_on:
      - paper-trading-engine

    command: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port 5006

