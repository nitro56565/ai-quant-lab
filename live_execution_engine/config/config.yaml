# Institutional Live Trading Engine v3.0 Master Configuration
system:
  environment: "production"
  timeframe: "1h"
  symbol: "EURUSD"
  log_level: "INFO"

broker:
  type: "LOCAL_PAPER"
  initial_capital: 10000.0
  spread_pips: 0.00012
  slippage_pips: 0.3
  commission_per_lot: 7.0
  fill_delay_ms: 300.0

risk:
  max_daily_drawdown_pct: 0.03
  risk_per_trade_pct: 0.01
  max_open_positions: 3

decision:
  probability_threshold: 0.34
  min_ev_pips: 0.0

session_filter:
  enabled: true
  start: "13:00"
  end: "16:00"

models:
  path: "trained_model_artifacts/production_deployment/certified_v1"
  warmup_start_date: "2014-01-01"
  warmup_end_date: "2026-08-06"


database:
  dialect: "sqlite"
  path: "live_execution_engine/logs/institutional_ledger.db"

monitoring:
  prometheus_port: 9090
  heartbeat_interval_sec: 60
  max_latency_ms: 5000.0
  telegram:
    enabled: true
    categories:
      signals: true
      fills: true
      exits: true
      risk_veto: true
      heartbeat: false
      reconnects: true
      startup: true
      daily_summary: true
      weekly_summary: true

scheduler:

  bar_close_seconds: 3600
  loop_sleep_seconds: 60.0
  weekend_shutdown: true

oanda:
  enabled: true
  api_key: "913a91a7741d9587eeac5017f3fc0d9c-b5ea76c5c5095ca65fea350d8716b1e1"
  account_id: "101-001-40013710-001"
  environment: "practice"

